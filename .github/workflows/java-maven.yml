name: Java Maven CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only
          MYSQL_DATABASE: restaurante_ci
          MYSQL_USER: restaurante_ci
          MYSQL_PASSWORD: ci_not_a_real_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      RESTAURANTE_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/restaurante_ci?connectionTimeZone=UTC
      RESTAURANTE_TEST_DB_USER: restaurante_ci
      RESTAURANTE_TEST_DB_PASSWORD: ci_not_a_real_secret
    steps:
      - name: Descargar código
        uses: actions/checkout@v5
      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - name: Construir ambos módulos y ejecutar pruebas Java, JDBC y HTTP
        run: mvn -B -ntp -f pom.xml clean verify
