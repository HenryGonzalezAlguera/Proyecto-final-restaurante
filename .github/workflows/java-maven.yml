name: Java Maven CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only
          MYSQL_DATABASE: restaurante_portafolio
          MYSQL_USER: restaurante_ci
          MYSQL_PASSWORD: ci_not_a_real_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      RESTAURANTE_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/restaurante_portafolio?connectionTimeZone=UTC
      RESTAURANTE_TEST_DB_USER: restaurante_ci
      RESTAURANTE_TEST_DB_PASSWORD: ci_not_a_real_secret

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: Restaurante/pom.xml

      - name: Compilar y ejecutar pruebas unitarias e integración MySQL
        run: mvn -B -ntp -f Restaurante/pom.xml clean verify
