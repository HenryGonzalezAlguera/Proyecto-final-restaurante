# Solo escucha localhost. No habilitar acceso remoto sin autenticación,
# autorización, CSRF, HTTPS y revisión de seguridad.
server.address=127.0.0.1
server.port=${RESTAURANTE_WEB_PORT:8085}
spring.application.name=restaurante-web
spring.thymeleaf.cache=false
server.error.include-message=never
server.error.include-stacktrace=never
